[workspace]
resolver = "2"
members = [
    "programs/narrative-auction",
    "programs/velocity-curve",
    "programs/lore-merge",
    "programs/reputation-nft",
]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Pin blake3 for Solana BPF/platform-tools (Cargo 1.75): blake3>=1.6 pulls digest 0.11 / edition2024
# Enforced via `cargo update -p blake3 --precise 1.5.5` into Cargo.lock
