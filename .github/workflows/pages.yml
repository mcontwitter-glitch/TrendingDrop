name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Public site targets Solana Devnet until Mainnet cutover (see docs/MAINNET.md).
      # Leave VITE_INDEXER_URL unset — browsers cannot reach localhost; UI uses on-chain/mock fallbacks.
      - name: Build (Devnet)
        env:
          VITE_SOLANA_RPC_URL: https://api.devnet.solana.com
          VITE_NARRATIVE_AUCTION_PROGRAM_ID: 75xWzXGb3A7UgpqDDL9ByVXpaZ8Zw4AF4i7whnVXyh8m
          VITE_VELOCITY_CURVE_PROGRAM_ID: 5VbDjccBDNVCPLpSgxyuw7ptYekrcxH8FySBxaAXx6C
          VITE_LORE_MERGE_PROGRAM_ID: 8pSr3X9iP66rvqMWT4S2gsEGtS8VnCLZtJayY9NB9ySy
          VITE_REPUTATION_NFT_PROGRAM_ID: DrzQKZpvg8y7Gymp5yz2upX24v3fV7j7eFuqT31Nxgvd
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
