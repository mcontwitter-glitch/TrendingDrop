[package]
name = "narrative-auction"
version = "0.1.0"
description = "Bonding Curve Casino — Phase 1 Narrative Auction"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "narrative_auction"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
