[package]
name = "lore-merge"
version = "0.1.0"
description = "TrendingDrop — Phase 3 Lore Merge"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lore_merge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
